name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.4.6 scipy==1.17.1 scikit-learn==1.9.1 pytest==9.2.0
      - run: python -m pytest -q
      - run: python render_results.py --check
